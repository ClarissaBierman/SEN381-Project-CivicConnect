# CI quality gate (DEC-013). Runs on every pull request to main and every push to main/backend.
# Make the "Backend" and "Frontend" checks required in Settings > Branches > main, so a red build blocks merging.
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, backend ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civicconnect-backend

    # Same database engine and major version as Supabase
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Throw-away credentials for this run only, so no secret is stored in the repository
      - name: Generate test credentials
        run: |
          echo "APP_DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # The same script that builds Supabase (schema V1+V2, audit trigger, dummy data, roles).
      # anon/authenticated are Supabase's own roles; the script revokes access from them.
      - name: Build the test database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -d postgres -f database/civicconnect_supabase_build.sql
          psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER ROLE civicconnect_app LOGIN PASSWORD '${APP_DB_PASSWORD}'"

      # Compiles, runs unit tests AND the integration tests against the database (Flyway applies V3+ as
      # the owner first), and writes the coverage report. Any failing test fails the job.
      - name: Build, test and measure coverage
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Pintegration,coverage
        env:
          DB_URL: jdbc:postgresql://localhost:5432/postgres
          DB_USERNAME: civicconnect_app
          DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
              printf "### Backend coverage\n| | Covered |\n|---|---|\n| Lines | %.1f%% |\n| Branches | %.1f%% |\n", 100*lc/(lm+lc), 100*bc/(bm+bc) }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            civicconnect-backend/target/surefire-reports/
            civicconnect-backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civicconnect-frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: civicconnect-frontend/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Unit tests
        run: npx ng test --watch=false

      # Security check on the packages that ship to the browser (build tools are excluded)
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high

  # System tests (M3): the critical journeys in a real browser against the integrated stack
  # (Angular dev server -> Spring Boot jar -> PostgreSQL built from the same script as Supabase).
  # Runs after the faster gates pass; a failing journey fails the workflow.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: civicconnect-frontend/package-lock.json

      - name: Generate test credentials
        run: |
          echo "APP_DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build the test database
        working-directory: civicconnect-backend
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -d postgres -f database/civicconnect_supabase_build.sql
          psql -v ON_ERROR_STOP=1 -d postgres -c "ALTER ROLE civicconnect_app LOGIN PASSWORD '${APP_DB_PASSWORD}'"

      - name: Build and start the backend
        working-directory: civicconnect-backend
        run: |
          chmod +x mvnw
          ./mvnw -B -q package -DskipTests
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*plain*' | head -1)
          nohup java -jar "$JAR" > backend.log 2>&1 &
        env:
          DB_URL: jdbc:postgresql://localhost:5432/postgres
          DB_USERNAME: civicconnect_app
          DB_PASSWORD: ${{ env.APP_DB_PASSWORD }}
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres

      - name: Install frontend and browser
        working-directory: civicconnect-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the frontend
        working-directory: civicconnect-frontend
        run: nohup npx ng serve --port 4200 > ng.log 2>&1 &

      - name: Wait until both are up
        run: |
          for i in $(seq 1 90); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/categories || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/login || true)
            if [ "$api" = "401" ] && [ "$web" = "200" ]; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "Stack did not start"; tail -50 civicconnect-backend/backend.log; exit 1

      - name: End-to-end tests
        working-directory: civicconnect-frontend
        run: npx playwright test

      - name: Upload end-to-end reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            civicconnect-frontend/playwright-report/
            civicconnect-frontend/test-results/
            civicconnect-backend/backend.log
          if-no-files-found: warn
