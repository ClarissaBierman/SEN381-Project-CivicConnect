# Static analysis and security checks (M3: static/code-quality + security/dependency/secrets).
name: Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, backend ]
  schedule:
    - cron: '23 4 * * 1'   # weekly, to catch new vulnerabilities in unchanged code

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin, javascript-typescript ]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scans the commits in this push / pull request for passwords, keys and tokens
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Fails a PR that adds a dependency with a known high or critical vulnerability
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
