spring.application.name=civicconnect-backend

# Database (values come from .env, never committed - see .env.example)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# Every connection uses the civicconnect schema and UTC, whatever the URL or the server says
spring.datasource.hikari.schema=civicconnect
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# Flyway runs as the schema owner (FLYWAY_USER, e.g. postgres), not as civicconnect_app: migrations
# change tables and grants, which the app's own login role is deliberately not allowed to do.
# The Supabase build script already created versions 1 and 2, so Flyway starts from V3.
spring.flyway.user=${FLYWAY_USER:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD}}
spring.flyway.schemas=civicconnect
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=civicconnect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Set SHOW_SQL=true in .env to log every SQL statement while debugging
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# All database work happens inside service transactions (needed for the per-user database roles)
spring.jpa.open-in-view=false

# Paging: no list returns more than 100 rows per page, whatever ?size= asks for
spring.data.web.pageable.max-page-size=100

# Errors use the PED error model - see common.error.GlobalExceptionHandler. Never send stack traces to the client.
server.error.include-stacktrace=never

# Security (DEC-010): JWT signing secret from .env, tokens valid for 60 minutes
civicconnect.jwt.secret=${JWT_SECRET}
civicconnect.jwt.expiry-minutes=60
civicconnect.cors.allowed-origins=http://localhost:4200

# Rate limits (B4) - see common.ratelimit
civicconnect.rate-limit.api.requests-per-minute=120
civicconnect.rate-limit.login.max-failures=5
civicconnect.rate-limit.login.window-minutes=15
civicconnect.rate-limit.register.per-email-per-hour=5

# Switch to the logged-in user's database role in every transaction.
# Set DB_SWITCH_ROLES=false in .env only for a local database without the civicconnect roles.
civicconnect.db.switch-roles=${DB_SWITCH_ROLES:true}
