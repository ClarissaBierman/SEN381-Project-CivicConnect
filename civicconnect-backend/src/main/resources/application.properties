spring.application.name=civicconnect-backend

# Database (values come from .env, never committed)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Flyway: the Supabase build script already created versions 1 and 2
spring.flyway.schemas=civicconnect
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=civicconnect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# All database work happens inside service transactions (needed for the per-user database roles)
spring.jpa.open-in-view=false

# Errors use the PED error model - see error/GlobalExceptionHandler. Never send stack traces to the client.
server.error.include-stacktrace=never

# Security (DEC-010): JWT signing secret from .env, tokens valid for 60 minutes
civicconnect.jwt.secret=${JWT_SECRET}
civicconnect.jwt.expiry-minutes=60
civicconnect.cors.allowed-origins=http://localhost:4200

# Switch to the logged-in user's database role in every transaction.
# Set DB_SWITCH_ROLES=false in .env only for a local database without the civicconnect roles.
civicconnect.db.switch-roles=${DB_SWITCH_ROLES:true}
