# Render Blueprint (ARC-03, C-07): one free web service built from the Dockerfile.
# It deploys the prod branch (D-31: main is merged into prod when the team releases), and only after the
# commit's GitHub checks pass (CI and Security), so a failing build or test never reaches the deployed app.
# Its database is the PRODUCTION Supabase project, built with civicconnect_production_build.sql (no dummy
# or default accounts). Setup steps: docs/deployment.md.
services:
  - type: web
    name: civicconnect
    runtime: docker
    plan: free                     # 512 MB, 0.1 CPU; sleeps after 15 minutes without traffic
    branch: prod
    region: frankfurt              # pick the region closest to the Supabase project - cannot be changed later
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      # Secrets: Render asks for these when the Blueprint is first created. Never commit them.
      - key: DB_URL                # Supabase session pooler (IPv4), e.g.
        sync: false                # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME           # civicconnect_app.<project-ref>
        sync: false
      - key: DB_PASSWORD           # civicconnect_app's password
        sync: false
      - key: FLYWAY_USER           # postgres.<project-ref> - migrations run as the schema owner
        sync: false
      - key: FLYWAY_PASSWORD       # the Supabase database password
        sync: false
      - key: JWT_SECRET            # random 256-bit value generated by Render
        generateValue: true
      # Render's proxy adds X-Forwarded-For: use it so the per-IP rate limits see the real client
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
